spring.application.name=BillMicroService
server.port=${BILL_SERVICE_PORT:2009}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/OPD}

# --- NEW LINES FOR STATIC FILE SERVING ---
# Configure static resource handling for uploaded files
# This tells Spring to expose the 'uploads' directory (relative to your JAR/project root)
# under the '/uploads' URL path.
spring.web.resources.static-locations=file:./uploads/
spring.mvc.static-path-pattern=/uploads/**

# Sets the maximum file size for a single file upload
spring.servlet.multipart.max-file-size=20MB

# Sets the maximum size of the entire multipart request
spring.servlet.multipart.max-request-size=20MB